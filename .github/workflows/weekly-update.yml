# The automated weekly update: imports new data, predicts upcoming matches, and commits
# the predictions to records/live_predictions.csv before kickoff.
#
# Runs on Tuesdays and Fridays, when football-data.co.uk posts midweek and weekend
# fixtures with odds, at two times in case the files are posted late. GitHub can start
# scheduled runs up to an hour late; predict_upcoming.py never touches a match that has
# already kicked off, so a late run can't produce an after-kickoff prediction.
name: Weekly update

on:
  schedule:
    - cron: "0 17 * * 2,5"   # Tuesdays and Fridays at 17:00 UTC (6pm UK, 1pm Eastern)
    - cron: "0 21 * * 2,5"   # and again at 21:00 UTC (10pm UK, 5pm Eastern)
  workflow_dispatch:          # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write             # allows the run to commit the prediction record

concurrency:
  group: weekly-update        # never run two updates at the same time
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run the tests (nothing is updated if any fail)
        run: pytest

      - name: Restore previously downloaded data files
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-

      - name: Update data and predictions
        run: python update.py --record

      - name: Commit the prediction record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add records/live_predictions.csv
          if git diff --cached --quiet; then
            echo "No new or changed predictions."
          else
            git commit -m "Record predictions ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
